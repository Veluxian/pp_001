services:
  frontend:
    build:
      context: ./front_pp_01 
    ports:
      - "3000:3000"
    volumes:
      - ./front_pp_01:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - WATCHPACK_INTERVAL=1000
